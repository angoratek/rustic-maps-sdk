[package]
name = "rustic-maps-core"
description = "Provider registry and orchestration core for the Maps SDK"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
# Offline-routing performance measurement: the deterministic synthetic-graph
# generators of `offline_routing_benchmark` and the Dijkstra reference search
# in `offline_routing`. Off by default, so published builds compile no
# benchmark-only routing code. `cargo bench -p rustic-maps-core --features
# bench` enables it; the criterion target declares it as a requirement.
bench = []

[dependencies]
geospatial-types.workspace = true
geospatial-traits.workspace = true
everymap-core.workspace = true
async-trait.workspace = true
tracing.workspace = true
url.workspace = true
web-time.workspace = true

# The offline routing graph archive format (M7 slice 5): pure byte parsing,
# viable on every target — wasm loads the graph from in-memory bytes.
rustic-maps-offline-graph-archive.workspace = true

[dev-dependencies]
tokio.workspace = true
# The shared coordinate and viewport fixtures.
rustic-maps-test-support.workspace = true

# The PBF→archive compiler is a test-only fixture producer here: it stays
# outside the SDK's production dependency graph on every target (its
# `osmpbf` dependency is native-only), and it feeds the criterion bench's
# fixture-scale compile-and-load group.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rustic-maps-offline-graph-compiler.workspace = true

# Criterion for the offline-search benchmark suite (M7 slice 6): benches run
# natively only (the wasm gate is lib-only), so the harness is dev-gated the
# same way the fixture producer above is.
criterion = "0.8"

# The A*-vs-Dijkstra reference benchmark; `harness = false` under the
# criterion main. Informational — the numbers are the recorded baseline, the
# CI alarm is the coarse budget test in `offline_routing_benchmark`. The
# target requires the `bench` feature (its generators and reference search),
# so requesting it without the feature fails with Cargo's own message.
[[bench]]
name = "offline_search_benchmark"
harness = false
required-features = ["bench"]