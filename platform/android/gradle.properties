# Silence the unsupported-JVM warning difference between the toolchain JVMs
# the host may carry; the slice is validated with Java 21 (Temurin).
org.gradle.java.installations.auto-download=false
# AGP 9 rejects `SourceSet.srcDir(Provider)` for generated asset directories in
# this shared root; the reference-application module wires its asset copy tasks
# onto `preBuild` manually, which is exactly the task-dependency the provider
# rejection warns would be carried automatically otherwise.
android.sourceset.disallowProvider=false
# The reference-application APK packages the Rust libraries for three ABIs,
# JNA, Compose and the generated bindings; AGP's splitter ran out of memory on
# the default heap while closing the APK and failed the packaging task with a
# bare `java.lang.OutOfMemoryError`. Four gigabytes matches the memory a
# developer machine already gives the daemon.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
