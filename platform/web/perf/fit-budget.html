<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vector fit-budget measurement</title>
    <!-- The generated package's only bare specifiers are the player runtime
         (`@ubjs/wasm`) and its core (`@ubjs/core`); the import map and the
         dev server's `/generated-runtime/@ubjs/...` route resolve them. -->
    <script type="importmap">
      {
        "imports": {
          "@ubjs/core": "/generated-runtime/@ubjs/core/dist/esm/index.js",
          "@ubjs/wasm": "/generated-runtime/@ubjs/wasm/dist/browser/src/index.js",
          "@ubjs/wasm/core": "/generated-runtime/@ubjs/wasm/dist/core/src/index.js"
        }
      }
    </script>
    <style>
      /* One bare GPU surface: no controls, no page pump, no overlay canvas. */
      html, body { margin: 0; padding: 0; background: #101418; }
      #fit-budget-canvas { display: block; width: 1920px; height: 1080px; }
    </style>
  </head>
  <body>
    <canvas id="fit-budget-canvas" width="1920" height="1080"></canvas>
    <!-- main.mjs loads the wasm module and exposes window.mapTest; the page
         module below creates the one MapView this scenario measures. The
         playground (and its own frame pump) is deliberately not loaded. -->
    <script type="module" src="../main.mjs"></script>
    <script type="module" src="./fit-budget-page.mjs"></script>
  </body>
</html>
