<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Golden Compare Fixture</title>
    <!-- The generated package's only bare specifiers are the player runtime
         (`@ubjs/wasm`) and its core (`@ubjs/core`); the import map and the
         dev server's `/generated-runtime/@ubjs/...` route resolve them. -->
    <script type="importmap">
      {
        "imports": {
          "@ubjs/core": "/generated-runtime/@ubjs/core/dist/esm/index.js",
          "@ubjs/wasm": "/generated-runtime/@ubjs/wasm/dist/browser/src/index.js",
          "@ubjs/wasm/core": "/generated-runtime/@ubjs/wasm/dist/core/src/index.js"
        }
      }
    </script>
  </head>
  <body>
    <!-- No interactive UI: the Playwright golden-compare test drives every
         frame through the page's `mapGolden*` window API. The canvas keeps
         the golden scenes' 512x512 extent, so the GPU surface is 1:1 with
         the committed golden fixtures at device scale one. -->
    <canvas id="golden-canvas" width="512" height="512"></canvas>
    <script type="module" src="./golden.mjs"></script>
  </body>
</html>
