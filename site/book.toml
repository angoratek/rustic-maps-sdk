# mdBook configuration for the public documentation site.
#
# These site sources are the rebuildable form of the published book: they are
# seeded into the `site/` directory of the public `rustic-maps-sdk-docs`
# repository's `main` branch when the repo is created (owner action); the
# private repo's `scripts/build-docs-site.sh` reads them from here until then.
# Book chapters are composed at build time from the workspace's own documents
# (README, docs/*.md, the generated third-party notices) by that script.

[book]
title = "Rustic Maps SDK"
description = "A native map SDK in Rust with UniFFI bindings for Android, iOS and React Native, and a first-class WebAssembly target."
authors = []
src = "book-src"

[build]
create-missing = false

# The build script copies these directories into the stage root beside
# book.toml; mdBook fingerprints the copies into the rendered book.
# The default theme is explicit-owned (never the browser preference) and
# dark-first, matching the reference apps: "dark" is not a valid mdBook
# theme name, so the dark default is "coal" and the dark variant is "navy".
[output.html]
default-theme = "coal"
preferred-dark-theme = "navy"
# Product documentation reads without draft-style chapter numbers; the sidebar
# keeps the group headings and page order.
no-section-label = true
additional-css = ["additional-css/product-docs.css"]
additional-js = ["additional-js/platform-tabs.js"]