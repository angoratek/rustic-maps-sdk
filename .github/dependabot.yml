version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      # CodeQL reads one configuration across every step that names it: an
      # update to init, analyze or upload-sarif alone makes the workflow fail
      # with "Loaded a configuration file for version X, but running version
      # Y". The group has no update-types so major releases move the three
      # steps as one pull request.
      codeql-action:
        patterns: ["github/codeql-action*"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/platform/web"
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/platform/rn"
    schedule:
      interval: weekly
    groups:
      react-native-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # React Native 0.88's Babel preset and its eslint config still peer on
    # Babel 7, so a Babel 8 update cannot resolve and never passes the app
    # shell build. Re-enable once the React Native toolchain moves.
    ignore:
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/platform/rn/app-shell"
    schedule:
      interval: weekly
    groups:
      react-native-app-shell-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Same Babel 7 peer constraint as /platform/rn. The eslint config of the
    # same React Native release peers on eslint 8 or 9, so eslint 10 cannot
    # resolve either.
    ignore:
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: "/platform/android"
    schedule:
      interval: weekly
    groups:
      android-gradle-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: "/platform/rn/app-shell/android"
    schedule:
      interval: weekly
    groups:
      react-native-gradle-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
