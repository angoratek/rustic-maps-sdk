version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/platform/web"
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/platform/rn"
    schedule:
      interval: weekly
    groups:
      react-native-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # React Native 0.88's Babel preset and its eslint config still peer on
    # Babel 7, so a Babel 8 update cannot resolve and never passes the app
    # shell build. Re-enable once the React Native toolchain moves.
    ignore:
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: "/platform/rn/app-shell"
    schedule:
      interval: weekly
    groups:
      react-native-app-shell-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Same Babel 7 peer constraint as /platform/rn.
    ignore:
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: "/platform/android"
    schedule:
      interval: weekly
    groups:
      android-gradle-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: "/platform/rn/app-shell/android"
    schedule:
      interval: weekly
    groups:
      react-native-gradle-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5
