name: android-platform-build

# Cross-builds the Android platform slice on ubuntu, without an emulator:
# the per-ABI Rust cdylibs with the NDK linkers (via scripts/build-android.sh,
# which also regenerates the uniffi Kotlin bindings from the frozen UDL
# metadata and runs the JVM smoke), then the Compose reference application's
# debug APK. No API key is provided: the refapps start keyless on purpose
# (the neutral "Set a provider key" state), and no key is ever set or echoed
# here.

on:
  workflow_dispatch:
  # The full platform matrix runs nightly on a schedule instead of on
  # every main push (Actions minutes are budgeted); a pull request keeps
  # the per-change gate for Android.
  schedule:
    - cron: "17 4 * * *"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "platform/android/**"
      - "scripts/build-android.sh"
      - "scripts/build-refapp-core.sh"
      - ".github/workflows/android-platform-build.yml"

concurrency:
  group: android-platform-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-platform-build:
    runs-on: ubuntu-latest
    env:
      # The GitHub ubuntu runners preinstall the Android SDK at this path and
      # already export ANDROID_HOME; restating both spellings keeps the
      # contract explicit (scripts/build-android.sh reads ANDROID_HOME).
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # Pinned ANDROID_NDK_VERSION of scripts/build-android.sh (any NDK 27+
      # works for the API-24 linker binaries); installed only when missing.
      ANDROID_NDK_VERSION: "28.2.13676358"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The cargo cross-builds for the three Android ABIs and the host build
      # that feeds uniffi-bindgen: the script adds the Android targets with
      # rustup itself, so plain stable is enough here.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Java 21 Temurin: the validated AGP 9.0.0 / Kotlin 2.2.21 matrix in
      # scripts/build-android.sh (setup-java exports JAVA_HOME for Gradle).
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.4
        with:
          # scripts/build-android.sh regenerates the Gradle wrapper at this
          # exact version; it needs `gradle` on PATH for that step.
          gradle-version: "9.5.1"

      - name: Install the pinned Android NDK
        # The script would install it itself; doing the no-op-if-present
        # install here keeps license or download failures in their own step.
        run: |
          if [ ! -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_VERSION}"
          fi

      - name: Cross-build the Rust cdylibs, regenerate the Kotlin bindings, assemble the AAR
        run: ./scripts/build-android.sh

      - name: Generate the refapp-only bindings for the reference application
        run: ./scripts/build-refapp-core.sh android

      - name: Run the Compose reference application unit suite
        run: ./gradlew --no-daemon :reference-application:testDebugUnitTest
        working-directory: platform/android

      - name: Assemble the Compose reference application (debug APK)
        run: ./gradlew --no-daemon :reference-application:assembleDebug
        working-directory: platform/android

      - name: Upload the reference application APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reference-application-debug-apk
          path: platform/android/reference-application/build/outputs/apk/debug/*.apk