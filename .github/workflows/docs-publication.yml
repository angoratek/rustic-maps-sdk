name: docs-publication

# Verifies the public documentation-site pipeline the same way CI verifies the
# Rust core: builds the mdBook book, stages rustdoc + the frozen UDL contract,
# runs the fail-closed pre-publish scrub, and uploads the staged site as a
# job artifact. Publication (--publish, which force-replaces the gh-pages
# branch of the public rustic-maps-sdk-docs repository) stays a deliberate
# local step run with --gates-green=<commit> from a clean tree; wiring it to CI needs
# a deploy-key secret in the private repository (owner action).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/THIRD_PARTY_NOTICES.md"
      - "crates/rustic-maps-native-core/src/rustic_maps.udl"
      - "scripts/build-docs-site.sh"
      - "scripts/mirror-docs-site-tree.mjs"
      - "scripts/mirror-docs-site-tree.test.mjs"
      - ".github/workflows/docs-publication.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Install mdbook
        run: cargo install mdbook --locked

      # The staged site carries the live demo at /demo, which serves the wasm
      # package built from this checkout; the package is a gitignored build
      # artifact, so the job builds it rather than assuming a local one.
      - name: Install the wasm toolchain
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version "$(sed -n 's/^wasm-bindgen = "\(.*\)"/\1/p' Cargo.toml | head -n 1)" --locked 2>/dev/null \
            || cargo install wasm-bindgen-cli --locked

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            platform/web/package-lock.json
            platform/rn/package-lock.json

      # The publisher's mirror keeps a checkout's downloads unless the staged
      # tree carries a complete replacement set; the test pins that rule
      # before the expensive site build.
      - name: Test the publish mirror
        run: node --test scripts/mirror-docs-site-tree.test.mjs

      - name: Install the generated-package toolchains
        run: |
          npm ci --no-audit --no-fund --prefix platform/web
          npm ci --no-audit --no-fund --prefix platform/rn

      - name: Build the WebAssembly package
        run: ./scripts/build-wasm2-package.sh

      # The API reference generator's suite reads the declaration mirror the
      # step above produces, so it runs here rather than in `format-and-lint`.
      - name: API reference generator tests
        run: node --test scripts/generate-api-reference.test.mjs

      # The notices generator resolves with `cargo metadata --offline`, which
      # consults the local registry index cache even with a complete lockfile
      # (verified: with a bare CARGO_HOME it fails "no matching package …
      # found" regardless of Cargo.lock). Prime the index once on the runner
      # before any offline consumer; the SDK code itself never calls the
      # network.
      - name: Prime the registry index for offline resolution
        run: cargo metadata --format-version 1 > /dev/null

      - name: Verify the third-party notices are current
        run: ./scripts/generate-third-party-notices && git diff --exit-code -- docs/THIRD_PARTY_NOTICES.md

      - name: Stage the site (build + rustdoc + UDL + scrub, no publish)
        run: ./scripts/build-docs-site.sh

      - name: Upload the staged site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site-stage
          path: target/docs-site-stage/site