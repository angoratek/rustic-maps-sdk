name: dependency-review

# Reviews the dependency changes a pull request introduces and reports known
# vulnerabilities. The high-severity threshold is configured now; `warn-only`
# keeps the check advisory until the repository's rulesets require it, then
# removing that input makes the same threshold blocking.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Review the dependency diff
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
          warn-only: true
