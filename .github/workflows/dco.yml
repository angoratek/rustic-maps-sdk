name: dco

# Requires a Developer Certificate of Origin sign-off on every commit in a
# pull request. The check is a checked-in Node script, so it needs no
# third-party application or token and works for fork pull requests too.

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sign-off:
    # Maintainer pull requests carry the maintainer's own commits and need no
    # sign-off; the requirement applies to contributions from anyone else.
    # Dependabot updates are authored by the bot, which cannot sign a commit,
    # so they are exempt in the same way; the dependency-review check is their
    # gate.
    if: >-
      github.event.pull_request.author_association != 'OWNER' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify every commit carries a matching Signed-off-by trailer
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-dco-signoff.mjs --range "${BASE_SHA}..${HEAD_SHA}"
