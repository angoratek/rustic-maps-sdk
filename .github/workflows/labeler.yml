name: pull-request-labeler

on:
  pull_request_target:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Apply path labels
    runs-on: ubuntu-latest
    steps:
      # Pinned to v6.2.0. The action reads only the changed-file list and never
      # checks out the pull request head, so pull_request_target is safe here.
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
