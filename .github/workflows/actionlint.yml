name: actionlint

# Lints every workflow on the changes that can affect one. actionlint reads
# the workflow files and runs shellcheck over their `run:` scripts, so a
# broken expression or an unsafe shell line fails here instead of at runtime.

on:
  push:
    # A merge to main is linted once; a pull request is linted by its own
    # pull_request run, so pushing its branch must not start a second one.
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
      - ".github/actionlint.yml"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actionlint.yaml"
      - ".github/actionlint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint 1.7.12
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Lint every workflow
        run: '"$(go env GOPATH)/bin/actionlint" -color'
